<a href="{{ url }}" class="article-card">

    <span class="article-card-media">
        {{ if hero_image }}
            <img src="{{ hero_image:url | sanitize }}" alt="" loading="lazy">
        {{ else }}
            <span class="article-card-placeholder" aria-hidden="true"></span>
        {{ /if }}
    </span>

    <span class="article-card-body">

        <span class="article-meta">
            {{ if category }}<span class="article-tag">{{ category }}</span>{{ /if }}
            <time datetime="{{ date format='Y-m-d' }}">{{ date format="j M Y" }}</time>
        </span>

        <span class="article-card-title">{{ title }}</span>

        {{ if excerpt }}
            <span class="article-card-text">{{ excerpt }}</span>
        {{ /if }}

        <span class="article-card-link">Läs artikeln <span aria-hidden="true">→</span></span>

    </span>

</a>
