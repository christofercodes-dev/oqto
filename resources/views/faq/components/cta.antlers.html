<section class="faq-cta-section">

    <div class="faq-cta-container">

        <div class="faq-cta-content">

            <h2 class="faq-cta-title">
                {{ cta_faq_title | nl2br }}
            </h2>

            <div class="faq-cta-buttons">

                <a
                    href="{{ cta_button_1_url }}"
                    class="faq-cta-button faq-cta-button-primary"
                >
                    <span>{{ cta_faq_button_text_1 }}</span>
                    <span class="faq-cta-arrow">→</span>
                </a>

                <a
                    href="{{ cta_faq_button_2_url }}"
                    class="faq-cta-button faq-cta-button-secondary"
                >
                    <span>{{ cta_faq_button_text_2 }}</span>
                    <span class="faq-cta-arrow">→</span>
                </a>

            </div>

        </div>

    </div>

</section>
