<section class="faq-hero-section">

    <div class="container">

        <div class="faq-hero-content">

           <!--  <span class="faq-hero-eyebrow">
                {{ faq_small_title }}
            </span> -->

            <h1 class="faq-hero-title">
                {{ faq_text | nl2br }}
            </h1>

            {{ if faq_body }}
                <p class="faq-hero-body">
                    {{ faq_body }}
                </p>
            {{ /if }}

            <div class="faq-eyes" aria-hidden="true">

                <div class="faq-eye">
                    <div class="faq-pupil"></div>
                </div>
            
                <div class="faq-eye">
                    <div class="faq-pupil"></div>
                </div>
            
            </div>

        </div>

    </div>

</section>


<script>
    document.addEventListener("DOMContentLoaded", () => {
    
        const eyes = document.querySelectorAll(".faq-eye");
    
        if (!eyes.length) return;

        // Touch-enheter saknar cursor - där tittar pupillerna i
        // scrollriktningen i stället (neråt vid scroll ned, uppåt vid
        // scroll upp) och glider tillbaka till mitten när det stannar.
        if (window.matchMedia("(hover: none)").matches) {

            const pupils = document.querySelectorAll(".faq-pupil");

            const MAX_TRAVEL = 22;
            const IDLE_MS = 350;

            let lastScrollY = window.scrollY;
            let idleTimer = null;

            pupils.forEach((pupil) => {
                pupil.style.transition = "transform 0.3s ease-out";
            });

            const lookAt = (y) => {
                pupils.forEach((pupil) => {
                    pupil.style.transform =
                        `translate(-50%, calc(-50% + ${y}px))`;
                });
            };

            window.addEventListener("scroll", () => {

                const delta = window.scrollY - lastScrollY;

                lastScrollY = window.scrollY;

                if (Math.abs(delta) < 2) return;

                lookAt(delta > 0 ? MAX_TRAVEL : -MAX_TRAVEL);

                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => lookAt(0), IDLE_MS);

            }, { passive: true });

            return;
        }

        document.addEventListener("mousemove", (event) => {
    
            eyes.forEach((eye) => {
    
                const pupil = eye.querySelector(".faq-pupil");
    
                const rect = eye.getBoundingClientRect();
    
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;
    
                const angle = Math.atan2(
                    event.clientY - eyeCenterY,
                    event.clientX - eyeCenterX
                );
    
                const distance = Math.min(
                    35,
                    Math.hypot(
                        event.clientX - eyeCenterX,
                        event.clientY - eyeCenterY
                    ) / 5
                );
    
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
    
                pupil.style.transform =
                    `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    
            });
    
        });
    
    });
    </script>
