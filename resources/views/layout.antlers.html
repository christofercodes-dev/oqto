<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {{ if seo_title ?? title }}
            <title>{{ (seo_title ?? title) | sanitize }} – {{ site:name }}</title>
        {{ else }}
            <title>{{ site:name }}</title>
        {{ /if }}

        {{ if seo_description }}
            <meta name="description" content="{{ seo_description | sanitize }}">
        {{ /if }}

        <link rel="icon" href="/favicon.ico" sizes="any">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">

        <script src="https://markly.kortaben.work/api/public/widget.js" data-project="oqto" defer></script>
        {{ vite src="resources/js/site.js|resources/css/site.css" }}
        <link rel="stylesheet" href="https://use.typekit.net/uwn4tkk.css">
    </head>
    <body class="antialiased font-sans leading-normal text-zinc-800 bg-white dark:text-zinc-400">
        {{ template_content }}
    </body>
</html>
