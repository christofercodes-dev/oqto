<!-- MOBILE MENU -->

<div class="mobile-menu" id="mobile-menu">

  <div class="mobile-menu-inner">

    <div class="mobile-menu-links">

      <a href="/om-oss" class="mobile-nav-link">
        <span>OM OSS</span>
        <span>↗</span>
      </a>

      <a href="/faqs" class="mobile-nav-link">
        <span>FAQ</span>
        <span>↗</span>
      </a>

      <a href="/integrationer" class="mobile-nav-link">
        <span>INTEGRATIONER</span>
        <span>↗</span>
      </a>

      <a href="/for-utvecklare" class="mobile-nav-link">
        <span>FÖR UTVECKLARE</span>
        <span>↗</span>
      </a>

      <a href="/jobb" class="mobile-nav-link">
        <span>JOBB</span>
        <span>↗</span>
      </a>

      <a href="/priser" class="mobile-nav-link">
        <span>PRISER</span>
        <span>↗</span>
      </a>

      <a href="/kontakt" class="mobile-nav-link">
        <span>KONTAKT</span>
        <span>↗</span>
      </a>

    </div>

    <a href="#login" class="mobile-login">
      <span>LOGGA IN</span>
      <span>→</span>
    </a>

  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
  
    const toggle = document.querySelector(".menu-toggle");
    const menu = document.querySelector(".mobile-menu");
  
    if (!toggle || !menu) return;
  
    toggle.addEventListener("click", function () {
  
      const isOpen = menu.classList.toggle("is-open");
  
      toggle.classList.toggle("is-open", isOpen);
  
      document.body.classList.toggle("menu-open", isOpen);
  
      toggle.setAttribute("aria-expanded", isOpen);
  
      toggle.setAttribute(
        "aria-label",
        isOpen ? "Stäng meny" : "Öppna meny"
      );
  
    });
  
    /* Stäng menyn när man klickar på en länk */
    menu.querySelectorAll("a").forEach(function (link) {
  
      link.addEventListener("click", function () {
  
        menu.classList.remove("is-open");
        toggle.classList.remove("is-open");
        document.body.classList.remove("menu-open");
  
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Öppna meny");
  
      });
  
    });
  
  });
  </script>
