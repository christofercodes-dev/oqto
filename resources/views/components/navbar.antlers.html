<nav class="navbar-wrapper">

  <div class="navbar-container">

    <!-- LOGO -->
    <a href="/" class="navbar-logo">
      <img src="/images/logos/logga02.svg" alt="OQTO">
    </a>

    <!-- DESKTOP MENU -->
    <div class="navbar-menu">

      {{ nav:main }}

        {{ if children }}

          <div class="nav-dropdown{{ if is_parent }} active{{ /if }}" data-dropdown>

            <button type="button" class="nav-link nav-dropdown-trigger" aria-expanded="false">
              <span>{{ title | upper }}</span>
              <svg class="nav-dropdown-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>

            <div class="nav-dropdown-menu">
              {{ children }}
                <a href="{{ url }}" class="nav-dropdown-link{{ if is_current }} active{{ /if }}">
                  {{ title }}
                </a>
              {{ /children }}
            </div>

          </div>

        {{ else }}

          <a href="{{ url }}" class="nav-link{{ if is_current }} active{{ /if }}">
              {{ title | upper }}
          </a>

        {{ /if }}

      {{ /nav:main }}

  </div>

    <!-- DESKTOP LOGIN -->
    <a href="#login" class="btn-login">
      <span>LOGGA IN</span>
      <span class="login-arrow">→</span>
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Öppna meny"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <span></span>
      <span></span>
    </button>

  </div>

</nav>


<!-- MOBILE MENU -->

<div class="mobile-menu" id="mobile-menu">

  <div class="mobile-menu-inner">

    <div class="mobile-menu-links">

      {{ nav:main }}

        {{ if children }}

          <div class="mobile-nav-item mobile-nav-group{{ if is_parent }} active{{ /if }}">

            <button type="button" class="mobile-nav-link mobile-nav-group-trigger" aria-expanded="false">
              <span>{{ title | upper }}</span>
              <span class="mobile-nav-group-chevron">
                <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </button>

            <div class="mobile-nav-submenu">
              <div class="mobile-nav-submenu-inner">
                {{ children }}
                  <a href="{{ url }}" class="mobile-nav-sublink{{ if is_current }} active{{ /if }}">
                    <span>{{ title }}</span>
                    <span>↗</span>
                  </a>
                {{ /children }}
              </div>
            </div>

          </div>

        {{ else }}

          <a href="{{ url }}" class="mobile-nav-link mobile-nav-item{{ if is_current }} active{{ /if }}">
            <span>{{ title | upper }}</span>
            <span>↗</span>
          </a>

        {{ /if }}

      {{ /nav:main }}

    </div>

    <a href="#login" class="mobile-login">
      <span>LOGGA IN</span>
      <span>→</span>
    </a>

  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
  
    const toggle = document.querySelector(".menu-toggle");
    const menu = document.querySelector(".mobile-menu");
  
    if (!toggle || !menu) return;
  
    toggle.addEventListener("click", function () {
  
      const isOpen = menu.classList.toggle("is-open");
  
      toggle.classList.toggle("is-open", isOpen);
  
      document.body.classList.toggle("menu-open", isOpen);
  
      toggle.setAttribute("aria-expanded", isOpen);
  
      toggle.setAttribute(
        "aria-label",
        isOpen ? "Stäng meny" : "Öppna meny"
      );
  
    });
  
    /* Stäng menyn när man klickar på en länk */
    menu.querySelectorAll("a").forEach(function (link) {

      link.addEventListener("click", function () {

        menu.classList.remove("is-open");
        toggle.classList.remove("is-open");
        document.body.classList.remove("menu-open");

        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Öppna meny");

      });

    });


    /* ==================================================
       DESKTOP DROPDOWN (t.ex. "Systemet")
       ================================================== */

    const dropdowns = document.querySelectorAll(".nav-dropdown");

    dropdowns.forEach(function (dropdown) {

      const trigger = dropdown.querySelector(".nav-dropdown-trigger");

      if (!trigger) return;

      trigger.addEventListener("click", function (event) {

        event.stopPropagation();

        const isOpen = dropdown.classList.contains("is-open");

        dropdowns.forEach(function (other) {
          other.classList.remove("is-open");
          other.querySelector(".nav-dropdown-trigger")?.setAttribute("aria-expanded", "false");
        });

        if (!isOpen) {
          dropdown.classList.add("is-open");
          trigger.setAttribute("aria-expanded", "true");
        }

      });

    });

    document.addEventListener("click", function (event) {

      if (event.target.closest(".nav-dropdown")) return;

      dropdowns.forEach(function (dropdown) {
        dropdown.classList.remove("is-open");
        dropdown.querySelector(".nav-dropdown-trigger")?.setAttribute("aria-expanded", "false");
      });

    });


    /* ==================================================
       MOBIL ACKORDEON (t.ex. "Systemet")
       ================================================== */

    menu.querySelectorAll(".mobile-nav-group-trigger").forEach(function (trigger) {

      trigger.addEventListener("click", function () {

        const group = trigger.closest(".mobile-nav-group");
        const isOpen = group.classList.toggle("is-expanded");

        trigger.setAttribute("aria-expanded", isOpen);

      });

    });

  });
  </script>
