<section class="hero-section">

    <div class="hero-container">

      <div class="hero-content">

        <div class="hero-left">
          <h1 class="hero-title">
            {{ title_row_1 }}
            {{ title_row_2 }}
          </h1>

          <p class="hero-text">
            {{ content | nl2br }}
          </p>
        </div>

        <div class="hero-right">
          <div class="hero-illustration-placeholder" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M21 15L16 10L5 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Bild / illustration</span>
          </div>
        </div>

      </div>

      <div class="hero-widget">
        <script
          src="https://markly.kortaben.work/api/public/widget.js"
          data-project="oqto"
          defer>
        </script>
      </div>

      <div class="hero-action-wrapper">

        <div class="corner-curve curve-left"></div>

        <div class="hero-action-card">

          <a
            href="{{ cta_link ?? '/boka-demo' }}"
            class="btn-demo"
            aria-label="{{ cta_text ?? 'BOKA DEMO' }}"
          >
            <span class="btn-text">
              {{ cta_text ?? "BOKA DEMO" }}
            </span>

            <span class="btn-arrow">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M3.33334 8H12.6667M12.6667 8L8 3.33334M12.6667 8L8 12.6667"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </a>

        </div>

        <div class="corner-curve curve-right"></div>

      </div>

    </div>

  </section>
