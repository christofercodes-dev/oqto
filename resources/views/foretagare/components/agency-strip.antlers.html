{{# Byråns topplist: logga och kontaktknapp, högst upp på sidan. Kan stängas av per byrå. #}}
{{ if agency && agency:show_topbar }}
    <div class="foretagare-agency-strip">

        <a href="{{ agency:base }}" class="foretagare-agency-id">
            {{ if agency:logo_url }}
                <img src="{{ agency:logo_url }}" alt="{{ agency:name }}" class="foretagare-agency-logo">
            {{ else }}
                <span class="foretagare-agency-name">{{ agency:name }}</span>
            {{ /if }}
        </a>

        {{ if agency:cta_url }}
            <a href="{{ agency:cta_url }}" class="foretagare-button foretagare-button-small">{{ agency:cta_label }}</a>
        {{ /if }}

    </div>
{{ /if }}
