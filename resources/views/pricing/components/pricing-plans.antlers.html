<section class="pricing-plans-section">

    <div class="container pricing-plans-container">

        {{ pricing_plans }}

            <article class="pricing-card pricing-card-{{ plan_title | slugify }}">

                {{ if recommended }}
                    <span class="pricing-card-badge">Rekommenderad</span>
                {{ /if }}

                <div class="pricing-card-top">

                    <h3 class="pricing-card-title">
                        {{ plan_title }}
                    </h3>

                    <span class="pricing-card-number">
                        {{ plan_number }}
                    </span>

                </div>

                {{ if description }}
                    <p class="pricing-card-description">
                        {{ description }}
                    </p>
                {{ /if }}

                <div class="pricing-card-price">

                    <span class="pricing-price">
                        {{ monthly_price }}
                    </span>

                    <span class="pricing-price-label">
                        kr / månad
                    </span>

                </div>

                {{ if highlights }}
                    <ul class="pricing-card-highlights">

                        {{ highlights }}
                            <li>
                                <span class="pricing-card-highlight-dash" aria-hidden="true">—</span>
                                <span>{{ value }}</span>
                            </li>
                        {{ /highlights }}

                    </ul>
                {{ /if }}

            </article>

        {{ /pricing_plans }}

    </div>

</section>
