<section class="about-cta-section">

    <div class="about-cta-container">

        <div class="about-cta-content">

            <h2 class="about-cta-title">
                {{ cta_title | nl2br }}
            </h2>

            <div class="about-cta-buttons">

                <a
                    href="{{ cta_button_1_url }}"
                    class="about-cta-button about-cta-button-primary"
                >
                    <span>{{ cta_button_1_text }}</span>
                    <span class="about-cta-arrow">→</span>
                </a>

                <a
                    href="{{ cta_button_2_url }}"
                    class="about-cta-button about-cta-button-secondary"
                >
                    <span>{{ cta_button_2_text }}</span>
                    <span class="about-cta-arrow">→</span>
                </a>

            </div>

        </div>

    </div>

</section>
