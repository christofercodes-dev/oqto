{{# Artikelkort grupperade per sektion. Får "sections" som parameter. #}}
{{ sections }}

    <div class="support-article-group">

        {{ if title }}
            <h2 class="support-section-title support-group-title">{{ title }}</h2>
        {{ /if }}

        <div class="support-article-grid">

            {{ articles }}

                <a href="{{ url }}" class="support-article-card">

                    <span class="support-article-card-icon" aria-hidden="true">
                        <svg viewBox="0 0 20 20" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            {{ if kind == "plug" }}
                                <path d="M7 3v4M13 3v4M5 7h10v3a5 5 0 01-10 0V7zM10 15v2.5"/>
                            {{ elseif kind == "upload" }}
                                <path d="M10 13V3.5M6.5 7L10 3.5 13.5 7M3.5 12.5v3a1 1 0 001 1h11a1 1 0 001-1v-3"/>
                            {{ elseif kind == "download" }}
                                <path d="M10 3.5V13M6.5 9.5L10 13l3.5-3.5M3.5 12.5v3a1 1 0 001 1h11a1 1 0 001-1v-3"/>
                            {{ else }}
                                <path d="M5 2.5h7l3 3v12H5z"/><path d="M12 2.5v3h3M7.5 9.5h5M7.5 12.5h5"/>
                            {{ /if }}
                        </svg>
                    </span>

                    <span class="support-article-card-text">
                        <h3 class="support-article-card-title">{{ title }}</h3>

                        {{ if description }}
                            <p class="support-article-card-description">{{ description }}</p>
                        {{ /if }}
                    </span>

                    <span class="support-article-card-arrow" aria-hidden="true">→</span>

                </a>

            {{ /articles }}

        </div>

    </div>

{{ /sections }}
