redaktoer:
  title: Redaktör
  permissions:
    - 'access cp'
    - 'view integrations entries'
    - 'edit integrations entries'
    - 'create integrations entries'
    - 'delete integrations entries'
    - 'publish integrations entries'
    - 'reorder integrations entries'
    - 'view pages entries'
    - 'edit pages entries'
    - 'create pages entries'
    - 'publish pages entries'
    - 'reorder pages entries'
    - 'view main nav'
    - 'edit main nav'
    - 'view integration_type terms'
    - 'edit integration_type terms'
    - 'create integration_type terms'
    - 'view sni_codes terms'
    - 'edit sni_codes terms'
    - 'create sni_codes terms'
    - 'view assets assets'
    - 'upload assets assets'
    - 'edit assets folders'
    - 'edit assets assets'
byraredaktor:
  title: Byråredaktör
  permissions:
    - 'access cp'
    - 'view agencies entries'
    - 'edit agencies entries'
    - 'create agencies entries'
    - 'delete agencies entries'
    - 'publish agencies entries'
    # Behövs för att kunna välja funktioner på byrån (fältet "features").
    - 'view foretagare_funktioner entries'
    # Behövs för att ladda upp och byta byråns logga.
    - 'view assets assets'
    - 'upload assets assets'
    - 'edit assets assets'
