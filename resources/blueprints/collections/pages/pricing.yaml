title: pricing
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: users
            field:
              type: users
              display: Users
          -
            handle: content
            field:
              type: markdown
              display: content
          -
            handle: pricing_button_text
            field:
              type: text
              display: 'pricing button text'
          -
            handle: pricing_button_url
            field:
              type: link
              display: 'pricing button url'
      -
        display: intro
        fields:
          -
            handle: intro_small_title
            field:
              type: text
              display: 'intro small title'
          -
            handle: intro_title
            field:
              type: text
              display: 'intro title'
          -
            handle: intro_body
            field:
              type: textarea
              display: 'intro body'
      -
        display: 'pricing plans'
        fields:
          -
            handle: pricing_plans
            field:
              type: replicator
              display: 'pricing plans'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    pricing_plan:
                      display: plan
                      fields:
                        -
                          handle: plan_title
                          field:
                            type: text
                            display: 'plan title'
                        -
                          handle: plan_number
                          field:
                            type: text
                            display: 'plan number'
                        -
                          handle: recommended
                          field:
                            type: toggle
                            display: recommended
                            instructions: 'Visar en "Rekommenderad"-badge på kortet.'
                        -
                          handle: description
                          field:
                            type: textarea
                            display: description
                        -
                          handle: features
                          field:
                            type: grid
                            display: features
                            instructions: 'En rad per funktion. Fyll i "Tooltip" bara på de rader som ska visa en (i)-ikon med förklarande text - lämna tomt annars.'
                            fields:
                              -
                                handle: label
                                field:
                                  type: text
                                  display: Text
                                  required: true
                                  validate:
                                    - required
                              -
                                handle: tooltip
                                field:
                                  type: textarea
                                  display: Tooltip
                                  instructions: 'Valfritt. Visas i en (i)-ikon bredvid texten.'
                        -
                          handle: monthly_price
                          field:
                            type: text
                            display: 'monthly price'
                        -
                          handle: verification_limit
                          field:
                            type: text
                            display: 'verification limit'
                        -
                          handle: highlights
                          field:
                            type: list
                            display: highlights
                            instructions: 'Kort punktlista (3–4 rader) som visas på kortet, t.ex. "1200 verifikat/år".'
      -
        display: 'comparison table'
        fields:
          -
            handle: comparison_small_title
            field:
              type: text
              display: 'comparison small title'
          -
            handle: comparison_title
            field:
              type: text
              display: 'comparison title'
          -
            handle: comparison_forvaltning_price
            field:
              type: text
              display: 'comparison förvaltning price'
              instructions: 'Endast siffror, t.ex. "20".'
          -
            handle: comparison_traditionell_price
            field:
              type: text
              display: 'comparison traditionell price'
              instructions: 'Endast siffror, t.ex. "125".'
          -
            handle: comparison_modern_price
            field:
              type: text
              display: 'comparison modern price'
              instructions: 'Endast siffror, t.ex. "250".'
          -
            handle: comparison_categories
            field:
              type: replicator
              display: 'comparison categories'
              instructions: 'Rader per kategori. Ange "check" eller "cross" som värde för att visa bock/kryss, eller skriv en egen text t.ex. "1200 st/år".'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    category:
                      display: Category
                      fields:
                        -
                          handle: category_title
                          field:
                            type: text
                            display: 'category title'
                        -
                          handle: rows
                          field:
                            type: replicator
                            display: rows
                            sets:
                              new_set_group:
                                display: 'New Set Group'
                                sets:
                                  row:
                                    display: Row
                                    fields:
                                      -
                                        handle: label
                                        field:
                                          type: text
                                          display: label
                                      -
                                        handle: detail
                                        field:
                                          type: textarea
                                          display: detail
                                          instructions: 'Valfritt. Om ifyllt visas ett expandera-alternativ på raden istället för en tooltip.'
                                      -
                                        handle: forvaltning_value
                                        field:
                                          type: text
                                          display: 'förvaltning value'
                                      -
                                        handle: traditionell_value
                                        field:
                                          type: text
                                          display: 'traditionell value'
                                      -
                                        handle: modern_value
                                        field:
                                          type: text
                                          display: 'modern value'
      -
        display: 'pricing faq'
        fields:
          -
            handle: pricing_faq
            field:
              type: replicator
              display: 'pricing faq'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    faq:
                      display: FAQ
                      fields:
                        -
                          handle: question
                          field:
                            type: text
                            display: question
                        -
                          handle: answer
                          field:
                            type: markdown
                            display: answer
                            instructions: 'Stöder länkar, t.ex. [priser](/priser).'
                        -
                          handle: highlight_plan_title
                          field:
                            type: text
                            display: 'highlight plan title'
                            instructions: 'Valfritt. Visar ett prisblock under svaret, t.ex. "Förvaltning". Lämna tomt för att inte visa något prisblock.'
                        -
                          handle: highlight_plan_description
                          field:
                            type: textarea
                            display: 'highlight plan description'
                        -
                          handle: highlight_monthly_price
                          field:
                            type: text
                            display: 'highlight monthly price'
                            instructions: 'Endast siffror, t.ex. "20". "kr/mån" läggs till automatiskt.'
                        -
                          handle: highlight_verification_limit
                          field:
                            type: text
                            display: 'highlight verification limit'
                            instructions: 'T.ex. "50 st/år".'
                        -
                          handle: highlight_included
                          field:
                            type: list
                            display: 'highlight included'
                            instructions: 'En rad per funktion som ingår, t.ex. "Bokföring".'
                        -
                          handle: highlight_excluded
                          field:
                            type: list
                            display: 'highlight excluded'
                            instructions: 'En rad per funktion som inte ingår.'
      -
        display: 'user levels'
        fields:
          -
            handle: users_small_title
            field:
              type: text
              display: 'users small title'
          -
            handle: users_title
            field:
              type: text
              display: 'users title'
          -
            handle: users_text
            field:
              type: textarea
              display: 'users text'
          -
            handle: user_levels
            field:
              type: replicator
              display: 'user levels'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    levels:
                      display: levels
                      fields:
                        -
                          handle: user_title
                          field:
                            type: text
                            display: 'user title'
                        -
                          handle: user_price
                          field:
                            type: text
                            display: 'user price'
                        -
                          handle: user_description
                          field:
                            type: textarea
                            display: 'user description'
      -
        display: Included
        fields:
          -
            handle: included_small_title
            field:
              type: text
              display: 'included small title'
          -
            handle: included_title
            field:
              type: text
              display: 'included title'
          -
            handle: included_text
            field:
              type: textarea
              display: 'included text'
          -
            handle: included_columns
            field:
              type: replicator
              display: 'included columns'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    columns:
                      display: columns
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: title
                        -
                          handle: items
                          field:
                            type: list
                            display: items
      -
        display: text
        fields:
          -
            handle: text_small_title
            field:
              type: text
              display: 'text small title'
          -
            handle: text_title
            field:
              type: text
              display: 'text title'
          -
            handle: text_body
            field:
              type: textarea
              display: 'text body'
      -
        display: notice
        fields:
          -
            handle: notice_title
            field:
              type: text
              display: 'notice title'
          -
            handle: notice_text
            field:
              type: textarea
              display: 'notice text'
      -
        display: routing
        fields:
          -
            handle: routing_title
            field:
              type: text
              display: 'routing title'
          -
            handle: routing_items
            field:
              type: replicator
              display: 'routing items'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    new_set:
                      display: 'New Set'
                      fields:
                        -
                          handle: routing_label
                          field:
                            type: text
                            display: 'routing label'
                        -
                          handle: routing_title
                          field:
                            type: text
                            display: 'routing title'
                        -
                          handle: routing_note
                          field:
                            type: text
                            display: 'routing note'
          -
            handle: routing_text
            field:
              type: textarea
              display: 'routing text'
      -
        display: cta
        fields:
          -
            handle: cta_title
            field:
              type: text
              display: 'cta title'
          -
            handle: cta_button_1_text
            field:
              type: text
              display: 'cta button 1 text'
          -
            handle: cta_button_1_url
            field:
              type: link
              display: 'cta button 1 url'
          -
            handle: cta_button_2_text
            field:
              type: text
              display: 'cta button 2 text'
          -
            handle: cta_button_2_url
            field:
              type: link
              display: 'cta button 2 url'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: seo
