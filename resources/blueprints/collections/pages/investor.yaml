title: 'Investerarträff, uppföljning'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: noindex
            field:
              type: toggle
              display: 'Dölj för sökmotorer'
              instructions: 'På: sidan får en noindex-tagg så att Google m.fl. inte listar den. Sidan finns inte heller i menyn, men den som har länken kommer åt den.'
              default: true
      -
        display: Sidan
        fields:
          -
            handle: investor_eyebrow
            field:
              type: text
              display: 'Liten text bredvid ikonen'
          -
            handle: investor_title
            field:
              type: text
              display: Rubrik
          -
            handle: investor_intro
            field:
              type: textarea
              display: Ingress
              instructions: 'Text under rubriken. En tom rad ger ett nytt stycke.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: seo
