title: developers
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: author
            field:
              type: users
              display: author
      -
        display: developers
        fields:
          -
            handle: developers_small_title
            field:
              type: text
              display: 'developers small title'
          -
            handle: developers_title
            field:
              type: text
              display: 'developers title'
          -
            handle: developers_body
            field:
              type: text
              display: 'developers body'
          -
            handle: developers_button_text
            field:
              type: text
              display: 'developers button text'
          -
            handle: developers_button_url
            field:
              type: link
              display: 'developers button url'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
