title: Funktioner
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              max_items: 1
      -
        display: Hero
        fields:
          -
            handle: hero_small_title
            field:
              type: text
              display: 'Liten förtext'
              instructions: 'Visas ovanför rubriken, t.ex. "FUNKTIONER".'
          -
            handle: hero_title
            field:
              type: textarea
              display: 'Rubrik'
              instructions: 'Radbryt manuellt där du vill att rubriken ska brytas.'
              validate:
                - required
          -
            handle: hero_body
            field:
              type: textarea
              display: 'Text under rubriken'
      -
        display: Funktionsblock
        fields:
          -
            handle: feature_blocks
            field:
              type: replicator
              display: 'Funktionsblock'
              instructions: 'Lägg till ett block per funktion. Varje block visas med antingen en bild eller en video.'
              collapse: true
              button_label: 'Lägg till funktionsblock'
              sets:
                bild:
                  display: 'Bild'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: image
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: Bild
                    -
                      handle: scroll_scrub
                      field:
                        type: toggle
                        display: 'Spela av vid scroll'
                        instructions: 'Bara relevant om Bild-fältet innehåller en video. I stället för att loopa spelas videon frame för frame i takt med scrollen (och baklänges om man scrollar upp).'
                        default: false
                betalningsdemo:
                  display: 'Betalningsdemo'
                  instructions: 'Visar den interaktiva demon av signeringsuppdraget (dummydata) i stället för en bild.'
                  fields:
                    -
                      handle: title
                      field:
                        type: textarea
                        display: Titel
                        instructions: 'Radbryt manuellt där du vill att rubriken ska brytas.'
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: bullets
                      field:
                        type: list
                        display: 'Punkter'
                        instructions: 'Visas som en bockad lista under texten.'
                    -
                      handle: show_banks
                      field:
                        type: toggle
                        display: 'Visa banker'
                        instructions: 'Slå på först när ni har bankernas tillstånd att visa deras logotyper/app-ikoner (Swedbank vill godkänna användningen: contentstudio@swedbank.se).'
                        default: false
                    -
                      handle: banks
                      field:
                        type: grid
                        display: 'Banker'
                        instructions: 'Visas som ett rutnät av app-ikoner under punkterna. Namnet används som alternativtext. Saknas ikon visas namnet som text.'
                        add_row: 'Lägg till bank'
                        mode: stacked
                        fields:
                          -
                            handle: name
                            field:
                              type: text
                              display: Namn
                              validate:
                                - required
                          -
                            handle: logo
                            field:
                              type: assets
                              container: assets
                              max_files: 1
                              display: 'App-ikon'
                              instructions: 'Kvadratisk bild (helst 512 x 512 px). Hörnen rundas av sajten.'
                video:
                  display: 'Video'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: video_file
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: 'Videofil'
                        instructions: 'Ladda upp en videofil, eller ange en Vimeo-länk nedan istället.'
                    -
                      handle: film_subject
                      field:
                        type: text
                        display: 'Ämne för filmknappen'
                        instructions: 'Visas i knappen före start: "Starta filmen om ...", t.ex. "Autopilot" eller "månadsavslutet". Tomt = bara "Starta filmen".'
                    -
                      handle: preview
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: 'Animation (förhandsvisning)'
                        instructions: 'Valfritt. En kort tyst animation som loopar i blocket tills man klickar på den - då startar filmen ovan. Bara när "Visa videospelare" är på.'
                    -
                      handle: embed_code
                      field:
                        type: text
                        display: 'Vimeo-länk'
                        instructions: 'Valfritt. Används om ingen videofil laddats upp.'
                    -
                      handle: embed_controls
                      field:
                        type: toggle
                        display: 'Visa videospelare'
                        instructions: 'Av: videon loopar tyst i bakgrunden. På: en spelare med stor play-knapp, kontroller och ljud (gäller både videofil och Vimeo-länk).'
                        default: false
                    -
                      handle: scroll_scrub
                      field:
                        type: toggle
                        display: 'Spela av vid scroll'
                        instructions: 'Spelar animationen (förhandsvisningen, annars videofilen) frame för frame i takt med scrollen i stället för att loopa. Bara för uppladdade filer, inte Vimeo-länk.'
                        default: false
                    -
                      handle: bullets
                      field:
                        type: list
                        display: 'Punkter'
                        instructions: 'Valfritt. Visas som en bockad lista under texten.'
      -
        display: 'Alla funktioner'
        fields:
          -
            handle: all_features_title
            field:
              type: text
              display: Rubrik
              default: 'Alla funktioner'
          -
            handle: feature_groups
            field:
              type: replicator
              display: 'Funktionsgrupper'
              instructions: 'Visas som en lång lista längst ner på sidan. Varje grupp är en ihopfällbar rad.'
              collapse: true
              button_label: 'Lägg till grupp'
              sets:
                group:
                  display: Grupp
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: subtitle
                      field:
                        type: text
                        display: Undertext
                    -
                      handle: icon
                      field:
                        type: select
                        display: Ikon
                        default: inbox
                        options:
                          inbox: Inkorg
                          book: Bok
                          invoice: Faktura
                          cart: Varukorg
                          bank: Bank
                          user: Person
                          sparkle: Gnista
                    -
                      handle: items
                      field:
                        type: grid
                        display: Funktioner
                        mode: stacked
                        add_row: 'Lägg till funktion'
                        fields:
                          -
                            handle: title
                            field:
                              type: text
                              display: Titel
                          -
                            handle: text
                            field:
                              type: textarea
                              display: Text
      -
        display: 'Avslutande länkar'
        fields:
          -
            handle: bottom_cards
            field:
              type: grid
              display: 'Länkkort'
              instructions: 'Visas som kort längst ner på sidan, t.ex. "Integrationer" och "Byter du från ett annat system?".'
              add_row: 'Lägg till kort'
              mode: stacked
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Rubrik
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: text
                    display: Text
                -
                  handle: url
                  field:
                    type: text
                    display: Länk
                    instructions: 'T.ex. /integrationer eller /support. Lägg en bit efter # för att hoppa till en del av sidan.'
                    validate:
                      - required
          -
            handle: bottom_button_text
            field:
              type: text
              display: 'Knapptext'
              default: 'Boka en demo'
          -
            handle: bottom_button_url
            field:
              type: text
              display: 'Knappens länk'
              default: /boka-demo
          -
            handle: bottom_note
            field:
              type: text
              display: 'Text bredvid knappen'
          -
            handle: bottom_note_url
            field:
              type: text
              display: 'Länk för texten bredvid knappen'
              instructions: 'Valfritt, t.ex. /kontakt.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: seo
