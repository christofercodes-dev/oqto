title: Funktioner
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              max_items: 1
      -
        display: Hero
        fields:
          -
            handle: hero_small_title
            field:
              type: text
              display: 'Liten förtext'
              instructions: 'Visas ovanför rubriken, t.ex. "FUNKTIONER".'
          -
            handle: hero_title
            field:
              type: textarea
              display: 'Rubrik'
              instructions: 'Radbryt manuellt där du vill att rubriken ska brytas.'
              validate:
                - required
          -
            handle: hero_body
            field:
              type: textarea
              display: 'Text under rubriken'
      -
        display: Funktionsblock
        fields:
          -
            handle: feature_blocks
            field:
              type: replicator
              display: 'Funktionsblock'
              instructions: 'Lägg till ett block per funktion. Varje block visas med antingen en bild eller en video.'
              collapse: true
              button_label: 'Lägg till funktionsblock'
              sets:
                bild:
                  display: 'Bild'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: image
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: Bild
                    -
                      handle: scroll_scrub
                      field:
                        type: toggle
                        display: 'Spela av vid scroll'
                        instructions: 'Bara relevant om Bild-fältet innehåller en video. I stället för att loopa spelas videon frame för frame i takt med scrollen (och baklänges om man scrollar upp).'
                        default: false
                video:
                  display: 'Video'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: video_file
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: 'Videofil'
                        instructions: 'Ladda upp en videofil, eller ange en Vimeo-länk nedan istället.'
                    -
                      handle: embed_code
                      field:
                        type: text
                        display: 'Vimeo-länk'
                        instructions: 'Valfritt. Används om ingen videofil laddats upp.'
                    -
                      handle: scroll_scrub
                      field:
                        type: toggle
                        display: 'Spela av vid scroll'
                        instructions: 'Bara relevant för uppladdad videofil (inte Vimeo-länk). I stället för att loopa spelas videon frame för frame i takt med scrollen (och baklänges om man scrollar upp).'
                        default: false
      -
        display: Säljvideo
        fields:
          -
            handle: small_title
            field:
              type: text
              display: 'Liten förtext'
          -
            handle: video_subtitle
            field:
              type: text
              display: Undertext
          -
            handle: video_heading
            field:
              type: text
              display: Rubrik
          -
            handle: video_body
            field:
              type: textarea
              display: Text
          -
            handle: video_file
            field:
              type: assets
              container: assets
              max_files: 1
              display: 'Videofil'
          -
            handle: embed_code
            field:
              type: text
              display: 'Vimeo-länk'
              instructions: 'T.ex. https://vimeo.com/123456789. Används om ingen videofil laddats upp.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: seo
