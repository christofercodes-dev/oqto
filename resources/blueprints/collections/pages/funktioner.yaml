title: Funktioner
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              max_items: 1
      -
        display: Hero
        fields:
          -
            handle: hero_small_title
            field:
              type: text
              display: 'Liten förtext'
              instructions: 'Visas ovanför rubriken, t.ex. "FUNKTIONER".'
          -
            handle: hero_title
            field:
              type: textarea
              display: 'Rubrik'
              instructions: 'Radbryt manuellt där du vill att rubriken ska brytas.'
              validate:
                - required
          -
            handle: hero_body
            field:
              type: textarea
              display: 'Text under rubriken'
      -
        display: Funktionsblock
        fields:
          -
            handle: feature_blocks
            field:
              type: replicator
              display: 'Funktionsblock'
              instructions: 'Lägg till ett block per funktion. Varje block visas med antingen en bild eller en video.'
              collapse: true
              button_label: 'Lägg till funktionsblock'
              sets:
                bild:
                  display: 'Bild'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: image
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: Bild
                    -
                      handle: scroll_scrub
                      field:
                        type: toggle
                        display: 'Spela av vid scroll'
                        instructions: 'Bara relevant om Bild-fältet innehåller en video. I stället för att loopa spelas videon frame för frame i takt med scrollen (och baklänges om man scrollar upp).'
                        default: false
                betalningsdemo:
                  display: 'Betalningsdemo'
                  instructions: 'Visar den interaktiva demon av signeringsuppdraget (dummydata) i stället för en bild.'
                  fields:
                    -
                      handle: title
                      field:
                        type: textarea
                        display: Titel
                        instructions: 'Radbryt manuellt där du vill att rubriken ska brytas.'
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: bullets
                      field:
                        type: list
                        display: 'Punkter'
                        instructions: 'Visas som en bockad lista under texten.'
                    -
                      handle: banks
                      field:
                        type: list
                        display: 'Banker'
                        instructions: 'Visas som små etiketter under punkterna.'
                video:
                  display: 'Video'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: text
                      field:
                        type: textarea
                        display: Text
                    -
                      handle: video_file
                      field:
                        type: assets
                        container: assets
                        max_files: 1
                        display: 'Videofil'
                        instructions: 'Ladda upp en videofil, eller ange en Vimeo-länk nedan istället.'
                    -
                      handle: embed_code
                      field:
                        type: text
                        display: 'Vimeo-länk'
                        instructions: 'Valfritt. Används om ingen videofil laddats upp.'
                    -
                      handle: embed_controls
                      field:
                        type: toggle
                        display: 'Visa videospelare'
                        instructions: 'Av: videon loopar tyst i bakgrunden. På: en spelare med stor play-knapp, kontroller och ljud (gäller både videofil och Vimeo-länk).'
                        default: false
                    -
                      handle: scroll_scrub
                      field:
                        type: toggle
                        display: 'Spela av vid scroll'
                        instructions: 'Bara relevant för uppladdad videofil (inte Vimeo-länk). I stället för att loopa spelas videon frame för frame i takt med scrollen (och baklänges om man scrollar upp).'
                        default: false
                    -
                      handle: bullets
                      field:
                        type: list
                        display: 'Punkter'
                        instructions: 'Valfritt. Visas som en bockad lista under texten.'
      -
        display: 'Alla funktioner'
        fields:
          -
            handle: all_features_title
            field:
              type: text
              display: Rubrik
              default: 'Alla funktioner'
          -
            handle: feature_groups
            field:
              type: replicator
              display: 'Funktionsgrupper'
              instructions: 'Visas som en lång lista längst ner på sidan. Varje grupp är en ihopfällbar rad.'
              collapse: true
              button_label: 'Lägg till grupp'
              sets:
                group:
                  display: Grupp
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Titel
                        validate:
                          - required
                    -
                      handle: subtitle
                      field:
                        type: text
                        display: Undertext
                    -
                      handle: icon
                      field:
                        type: select
                        display: Ikon
                        default: inbox
                        options:
                          inbox: Inkorg
                          book: Bok
                          invoice: Faktura
                          cart: Varukorg
                          bank: Bank
                          user: Person
                          sparkle: Gnista
                    -
                      handle: items
                      field:
                        type: grid
                        display: Funktioner
                        mode: stacked
                        add_row: 'Lägg till funktion'
                        fields:
                          -
                            handle: title
                            field:
                              type: text
                              display: Titel
                          -
                            handle: text
                            field:
                              type: textarea
                              display: Text
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: seo
