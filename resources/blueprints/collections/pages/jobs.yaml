title: jobs
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: author
            field:
              type: users
              display: author
          -
            handle: template
            field:
              type: template
              display: template
      -
        display: 'första sidan'
        fields:
          -
            handle: jobs_title
            field:
              type: text
              display: 'jobs title'
          -
            handle: jobs_text
            field:
              type: textarea
              display: 'jobs text'
      -
        display: 'lediga jobb'
        fields:
          -
            handle: jobs_openings_small_title
            field:
              type: text
              display: jobs_openings_small_title
          -
            handle: jobs_openings_title
            field:
              type: text
              display: jobs_openings_title
          -
            handle: jobs_openings_intro
            field:
              type: textarea
              display: jobs_openings_intro
      -
        display: CTA
        fields:
          -
            handle: cta_title
            field:
              type: textarea
              display: 'cta title'
          -
            handle: button_1_text
            field:
              type: text
              display: 'button 1 text'
          -
            handle: button_1_url
            field:
              type: link
              display: 'button 1 url'
          -
            handle: button_2_text
            field:
              type: text
              display: 'button 2 text'
          -
            handle: button_2_url
            field:
              type: link
              display: 'button 2 url'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
