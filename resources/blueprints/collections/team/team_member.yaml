title: 'Team member'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
      -
        display: 'team member'
        fields:
          -
            handle: role
            field:
              type: text
              display: Roll
          -
            handle: description
            field:
              type: text
              display: Beskrivning
          -
            handle: image
            field:
              container: assets
              type: assets
              display: Bild
          -
            handle: email
            field:
              type: text
              display: E-post
          -
            handle: phone
            field:
              type: text
              display: Telefon
      -
        display: Press
        fields:
          -
            handle: press_contact
            field:
              type: toggle
              display: 'Tillgänglig som presskontakt'
              instructions: 'Personen kan väljas som kontakt på pressmeddelanden. Namn, titel, e-post, telefon och bild hämtas härifrån, så fyll i dem ovan.'
              default: false
          -
            handle: press_default_contact
            field:
              type: toggle
              display: 'Förvald presskontakt'
              instructions: 'Väljs automatiskt när du skapar ett nytt pressmeddelande (kan tas bort där). Här styr du förvalet, på ett enda ställe.'
              default: false
              if:
                press_contact: 'equals true'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
