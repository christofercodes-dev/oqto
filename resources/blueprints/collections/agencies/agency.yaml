title: Byrå
tabs:
  main:
    display: Byrå
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: 'Byråns namn'
              instructions: 'T.ex. "Enora". Adressen blir /byra/enora.'
              required: true
              validate:
                - required
          -
            handle: logo
            field:
              type: assets
              container: assets
              max_files: 1
              display: Logotyp
              instructions: 'Visas överst på byråns sidor. Helst en SVG eller PNG med transparent bakgrund.'
          -
            handle: brand_color
            field:
              type: color
              display: Huvudfärg
              instructions: 'Används för knappar, länkar och accenter på byråns sidor. Textfärgen på knapparna väljs automatiskt så att den går att läsa.'
              default: '#ff6319'
              theme: classic
      -
        display: Topplist
        fields:
          -
            handle: show_topbar
            field:
              type: toggle
              display: 'Visa topplist'
              instructions: 'En list överst på sidorna med byråns logga och kontaktknapp. Stäng av om sidorna ska visas utan den, t.ex. när de bäddas in på byråns egen sajt.'
              default: true
      -
        display: Inbäddning
        fields:
          -
            handle: allow_embed
            field:
              type: toggle
              display: 'Tillåt inbäddning på andra sajter'
              instructions: 'Låter byrån visa sina sidor i en iframe på sin egen webbplats. Inbäddade sidor visas utan topplist, med "Drivs av Oqto" kvar i botten. Av som standard; då går sidorna bara att visa på oqto.se. Koden att skicka till byrån finns längre ned (Inbäddningskod).'
              default: false
          -
            handle: embed_domains
            field:
              type: list
              display: 'Sajter som får bädda in'
              instructions: 'En adress per rad, t.ex. "digim.se". Då får bara de sajterna visa byråns sidor i en ram (både med och utan www). Med "*.digim.se" släpps även underdomäner in. Lämnas listan tom får vilken sajt som helst bädda in, så fyll helst i byråns egen sajt.'
              if:
                allow_embed: 'equals true'
          -
            handle: embed_code
            field:
              type: code
              display: Inbäddningskod
              instructions: 'Skicka den här koden till byrån, som lägger in den där sidan ska visas på sin webbplats. Adressen är byråns egen och fylls i automatiskt. Glöm inte att lägga byråns sajt under "Sajter som får bädda in", annars blir ramen tom (eller öppen för alla om listan är tom).'
              mode: htmlmixed
              mode_selectable: false
              line_numbers: false
              visibility: computed
              if:
                allow_embed: 'equals true'
      -
        display: Funktioner
        fields:
          -
            handle: features
            field:
              type: entries
              collections:
                - foretagare_funktioner
              display: 'Funktioner byrån visar'
              instructions: 'Välj de funktioner byrån vill lista, i den ordning de ska visas. Lämnas tomt visas alla funktioner. Innehållet hämtas alltid från "För företagare", här väljer du bara vilka som visas.'
              create: false
      -
        display: Typsnitt
        fields:
          -
            handle: heading_font
            field:
              type: select
              display: 'Typsnitt för rubriker'
              instructions: 'Lämnas tomt används Oqtos eget typsnitt.'
              clearable: true
              width: 50
              options:
                inter: 'Inter (sans serif)'
                manrope: 'Manrope (sans serif)'
                roboto: 'Roboto (sans serif)'
                noto-serif: 'Noto Serif (serif)'
                source-serif-4: 'Source Serif 4 (serif)'
          -
            handle: body_font
            field:
              type: select
              display: 'Typsnitt för brödtext'
              instructions: 'Lämnas tomt används Oqtos eget typsnitt.'
              clearable: true
              width: 50
              options:
                inter: 'Inter (sans serif)'
                manrope: 'Manrope (sans serif)'
                roboto: 'Roboto (sans serif)'
                noto-serif: 'Noto Serif (serif)'
                source-serif-4: 'Source Serif 4 (serif)'
      -
        display: Texter
        fields:
          -
            handle: intro_title
            field:
              type: text
              display: Rubrik
              instructions: 'Rubriken på byråns startsida. Lämnas tomt blir den "Funktioner för dig som är kund hos {byrå}".'
          -
            handle: intro_text
            field:
              type: textarea
              display: Text
              instructions: 'Text under rubriken (valfri).'
              rows: 3
          -
            handle: cta_label
            field:
              type: text
              display: 'Knapptext'
              instructions: 'Text på kontaktknappen, t.ex. "Kontakta oss". Lämnas tomt blir den "Kontakta oss".'
          -
            handle: contact_url
            field:
              type: text
              display: 'Länk för kontaktknappen'
              instructions: 'Webbadress dit knappen leder, t.ex. byråns kontaktsida. Om du lämnar den tom men fyller i e-post nedan blir knappen en e-postlänk.'
          -
            handle: contact_email
            field:
              type: text
              display: 'Kontakt, e-post'
              validate:
                - nullable
                - email
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
