title: Kundomdöme
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            display: 'Namn Efternamn'
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: company
            field:
              type: text
              display: Företag
          -
            handle: role
            field:
              type: text
              display: Roll
          -
            handle: industry
            field:
              type: terms
              display: Bransch
              taxonomies:
                - review_industry
              instructions: 'Används för att på sikt kunna filtrera omdömen per bransch.'
          -
            handle: quote
            field:
              type: textarea
              display: Citat
              validate:
                - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
