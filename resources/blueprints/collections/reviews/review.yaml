title: Kundomdöme
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            display: 'Namn Efternamn'
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: company
            field:
              type: text
              display: Företag
          -
            handle: role
            field:
              type: text
              display: Roll
          -
            handle: logo
            field:
              type: assets
              container: assets
              folder: kunder
              max_files: 1
              display: 'Kundens logotyp'
              instructions: 'Visas under citatet. Helst en SVG eller PNG med transparent bakgrund.'
          -
            handle: website
            field:
              type: text
              input_type: url
              display: 'Kundens webbplats'
              instructions: 'Loggan länkar hit i en ny flik. Börja med https://. Utan adress visas loggan utan länk.'
          -
            handle: industry
            field:
              type: terms
              display: Bransch
              taxonomies:
                - review_industry
              instructions: 'Används för att på sikt kunna filtrera omdömen per bransch.'
          -
            handle: quote
            field:
              type: textarea
              display: Citat
              validate:
                - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
