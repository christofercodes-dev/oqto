title: 'Boka demo'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: first_name
            field:
              type: text
              display: Förnamn
              validate: required
          -
            handle: last_name
            field:
              type: text
              display: Efternamn
              validate: required
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'E-post'
              validate: 'required|email'
          -
            handle: phone
            field:
              type: text
              display: Telefon
          -
            handle: company
            field:
              type: text
              display: 'Företag'
          -
            handle: org_number
            field:
              type: text
              display: 'Organisationsnummer'
          -
            handle: message
            field:
              type: textarea
              display: Meddelande
          -
            handle: is_agency
            field:
              type: toggle
              display: 'Företräder en byrå'
              instructions: 'Ikryssad av besökare som inte identifierades som byrå men själva uppger att de är en redovisnings- eller revisionsbyrå.'
          -
            handle: utm_source
            field:
              type: text
              display: 'UTM Source'
              instructions: 'Fylls i automatiskt från besökarens första kampanjlänk. Redigera inte.'
          -
            handle: utm_medium
            field:
              type: text
              display: 'UTM Medium'
          -
            handle: utm_campaign
            field:
              type: text
              display: 'UTM Campaign'
          -
            handle: utm_content
            field:
              type: text
              display: 'UTM Content'
          -
            handle: utm_term
            field:
              type: text
              display: 'UTM Term'
          -
            handle: gclid
            field:
              type: text
              display: 'Google Click ID (gclid)'
          -
            handle: landing_page
            field:
              type: text
              display: 'Landningssida'
