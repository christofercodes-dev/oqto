title: 'Investerarträff, anmälan'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: attending
            field:
              type: select
              display: Svar
              listable: true
              options:
                yes: Kommer
                no: 'Kommer inte'
              validate:
                - 'required'
                - 'in:yes,no'

          -
            handle: info_preference
            field:
              type: text
              display: 'Önskad information (om nej)'
              listable: hidden
              validate:
                - 'nullable'
                - 'required_if:attending,no'
                - 'in:Informationsmaterial via e-post,Telefonsamtal,Separat möte,Digitalt möte'

          -
            handle: joins_dinner
            field:
              type: select
              display: 'Middag'
              listable: hidden
              options:
                yes: Ja
                no: Nej
              validate:
                - 'nullable'
                - 'required_if:attending,yes'
                - 'in:yes,no'

          -
            handle: needs_accommodation
            field:
              type: select
              display: 'Hjälp med boende'
              listable: hidden
              options:
                yes: Ja
                no: Nej
              validate:
                - 'nullable'
                - 'required_if:attending,yes'
                - 'in:yes,no'

          -
            handle: separate_rooms
            field:
              type: select
              display: 'Separata rum'
              listable: hidden
              options:
                yes: Ja
                no: Nej
              validate:
                - 'nullable'
                - 'in:yes,no'

          -
            handle: share_consent
            field:
              type: select
              display: 'Får dela deltagande'
              listable: hidden
              options:
                yes: Ja
                no: Nej
              validate:
                - 'nullable'
                - 'required_if:attending,yes'
                - 'in:yes,no'

          -
            handle: company
            field:
              type: text
              display: 'Företag'
              listable: true
              validate:
                - 'nullable'
                - 'max:150'

          -
            handle: attendee1_name
            field:
              type: text
              display: 'Namn'
              listable: true
              validate:
                - 'required'
                - 'max:100'

          -
            handle: attendee1_email
            field:
              type: text
              display: 'E-post'
              listable: true
              validate:
                - 'required'
                - 'email'
                - 'max:255'
                - 'new \App\Rules\UniqueInvestorRsvpEmail'

          -
            handle: attendee1_phone
            field:
              type: text
              display: 'Telefon'
              listable: hidden
              validate:
                - 'nullable'
                - 'max:30'

          -
            handle: attendee1_allergies
            field:
              type: text
              display: 'Allergier / specialkost'
              listable: hidden
              validate:
                - 'nullable'
                - 'max:300'

          -
            handle: attendee2_name
            field:
              type: text
              display: 'Deltagare 2, namn'
              listable: hidden
              validate:
                - 'nullable'
                - 'required_with:attendee2_email'
                - 'max:100'

          -
            handle: attendee2_email
            field:
              type: text
              display: 'Deltagare 2, e-post'
              listable: hidden
              validate:
                - 'nullable'
                - 'required_with:attendee2_name'
                - 'email'
                - 'max:255'
                - 'different:attendee1_email'
                - 'new \App\Rules\UniqueInvestorRsvpEmail'

          -
            handle: attendee2_phone
            field:
              type: text
              display: 'Deltagare 2, telefon'
              listable: hidden
              validate:
                - 'nullable'
                - 'max:30'

          -
            handle: attendee2_allergies
            field:
              type: text
              display: 'Deltagare 2, allergier'
              listable: hidden
              validate:
                - 'nullable'
                - 'max:300'

          -
            handle: message
            field:
              type: textarea
              display: 'Övrigt meddelande'
              listable: hidden
              validate:
                - 'nullable'
                - 'max:1000'

