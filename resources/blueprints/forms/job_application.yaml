title: 'Jobbansökan'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: job_title
            field:
              type: text
              display: 'Tjänst'
              validate: required
          -
            handle: name
            field:
              type: text
              display: 'Förnamn & efternamn'
              validate: required
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'E-post'
              validate: 'required|email'
          -
            handle: phone_country
            field:
              type: text
              display: 'Landskod'
          -
            handle: phone
            field:
              type: text
              display: 'Telefonnummer'
          -
            handle: linkedin
            field:
              type: text
              display: 'LinkedIn'
          -
            handle: message
            field:
              type: textarea
              display: 'Meddelande'
          -
            handle: expertise
            field:
              type: checkboxes
              display: 'Expertis'
              options:
                - Admin
                - 'Customer Success'
                - Development
                - Marketing
                - 'Product Management'
                - Sales
                - UI/UX
          -
            handle: location_preference
            field:
              type: checkboxes
              display: 'Önskad placeringsort'
              options:
                - Malmö/Lund
                - Växjö
                - Stockholm
                - Hybrid
          -
            handle: utm_source
            field:
              type: text
              display: 'UTM Source'
              instructions: 'Fylls i automatiskt från besökarens första kampanjlänk. Redigera inte.'
          -
            handle: utm_medium
            field:
              type: text
              display: 'UTM Medium'
          -
            handle: utm_campaign
            field:
              type: text
              display: 'UTM Campaign'
          -
            handle: utm_content
            field:
              type: text
              display: 'UTM Content'
          -
            handle: utm_term
            field:
              type: text
              display: 'UTM Term'
          -
            handle: gclid
            field:
              type: text
              display: 'Google Click ID (gclid)'
          -
            handle: landing_page
            field:
              type: text
              display: 'Landningssida'
